<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow"> <!-- TEST VERSION: remove this line when the site is final -->
<meta name="theme-color" content="#0e0e10">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gustavo Mondini's Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0e0e10;--ink:#f6e4ec;--muted:#b39aa8;--accent:#f6a9cf;--card:#1a191c;--line:#2f2b2f}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.6 Figtree,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:"Bricolage Grotesque",Georgia,sans-serif;line-height:1.05;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}

body.home::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:url("img/brand/mondgine-watermark.png") center/min(80vmin,780px) no-repeat;opacity:.17}
#app{position:relative;z-index:1}
header{padding:72px 0 40px}
header h1{font-size:clamp(2.4rem,7vw,5.2rem);font-weight:800;letter-spacing:-.02em;max-width:14ch}
header p{margin:20px 0 0;font-size:clamp(1.1rem,2.4vw,1.5rem);color:var(--muted);max-width:30ch}

.projects h2{font-size:clamp(1.6rem,3.5vw,2.4rem);margin-bottom:28px}
.railwrap{position:relative}
.railwrap:last-child{margin-bottom:60px}
.rail{overflow-x:auto;overflow-y:hidden;padding:12px 0 40px;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.track{display:flex;gap:20px;width:max-content}
.railwrap .arrow{top:132px}
@media (max-width:600px){.railwrap .arrow{top:102px;width:40px;height:40px}}
.railwrap.wide .card{aspect-ratio:16/9}
.railwrap.wide .arrow{top:102px}
@media (max-width:600px){.railwrap.wide .arrow{top:79px}}
.card{position:relative;flex:0 0 auto;width:320px;aspect-ratio:4/3;border-radius:10px;overflow:hidden;display:block;background:var(--card);text-decoration:none}
.card .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card .name{position:absolute;inset:0;display:flex;align-items:flex-end;padding:20px;font:800 1.5rem/1.1 "Bricolage Grotesque",sans-serif;color:#fff;background:linear-gradient(to top,rgba(8,8,10,.88),rgba(8,8,10,.1) 65%);opacity:0;transition:opacity .25s}
.card .name small{display:block;margin-top:8px;font:500 .9rem/1.4 Figtree,sans-serif;color:#d9e2dc}
.card.locked{cursor:default}
.card:hover .name,.card:focus-visible .name{opacity:1}
.card:hover .cover{transform:scale(1.05)}

.plist{list-style:none;margin:0;padding:0 0 6px;display:flex;gap:12px;overflow-x:auto}
.plist li{flex:1 1 0;min-width:200px}
.pbtn{position:relative;display:flex;flex-direction:column;gap:8px;height:100%;padding:8px 8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--card);text-decoration:none;transition:border-color .2s,transform .2s,background .2s}
a.pbtn:hover,a.pbtn:focus-visible{border-color:var(--accent);transform:translateY(-2px);background:#211f23}
.pbtn.locked{cursor:default}
.pbtn .chip{height:44px;padding:6px 10px;border-radius:6px}
.pbtn .chip img{max-height:28px}
.ptext{display:flex;flex-direction:column;gap:2px;min-width:0;padding:0 26px 0 4px}
.pname{font:800 1rem/1.15 "Bricolage Grotesque",sans-serif;color:var(--ink)}
.prole{font-size:.78rem;line-height:1.3;color:var(--muted)}
.pbtn .go{position:absolute;right:10px;bottom:10px;width:18px;height:18px;color:var(--accent)}
.about{padding:8px 0 100px}
.about h2{font-size:clamp(1.6rem,3.5vw,2.4rem);margin-bottom:24px}
.aboutgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:56px;align-items:start}
.abouttext p{margin:0 0 1em;max-width:62ch}
.abouttext .lead{font-size:1.2rem;color:var(--ink)}
.morebtn{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;color:var(--accent);font:inherit;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.morebtn[hidden]{display:none}
.morebtn:hover{color:var(--ink)}
.more{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .4s ease,opacity .4s ease}
.more.open{grid-template-rows:1fr;opacity:1}
.moreinner{overflow:hidden;min-height:0}
.moreinner p:focus{outline:none}
@media (prefers-reduced-motion:reduce){.more{transition:none}}
.aboutfacts{margin:24px 0 0;padding:18px 0 0;border-top:2px solid var(--accent);display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px 24px}
.aboutfacts dt{font-size:.85rem;color:var(--muted)}
.aboutfacts dd{margin:2px 0 0;font-weight:500}
.aboutphoto{position:relative;margin:0;justify-self:center;width:100%;max-width:380px;aspect-ratio:1/1;border:2px solid var(--accent);border-radius:22px;overflow:hidden;background:radial-gradient(circle at 50% 28%,#4a2e3f 0%,#241a22 55%,#17141a 100%);box-shadow:12px 12px 0 rgba(246,169,207,.16);align-self:start}
.aboutphoto img{position:absolute;left:0;bottom:0;width:100%;height:100%;object-fit:contain;object-position:center bottom}
@media (max-width:800px){.aboutgrid{grid-template-columns:1fr;gap:32px}.aboutphoto{order:-1;max-width:300px}}
.card.nocover .name{opacity:1}
.acad{padding:44px 0 8px;border-top:1px solid var(--line)}
.project > h1 + .acad{border-top:0;padding-top:8px}
.acad h2{font-size:clamp(1.8rem,4vw,2.8rem);margin-bottom:24px}
.acadtop{display:grid;grid-template-columns:minmax(0,315px) minmax(0,1fr);gap:36px;align-items:start}
.coverlink{position:relative;display:block;line-height:0;border:2px solid var(--accent);border-radius:14px;overflow:hidden;background:var(--card);box-shadow:10px 10px 0 rgba(246,169,207,.16);transition:transform .25s}
a.coverlink:hover,a.coverlink:focus-visible{transform:translateY(-3px)}
.coverlink img{width:100%;height:auto;display:block}
.cl{position:absolute;left:0;right:0;bottom:0;padding:28px 14px 10px;background:linear-gradient(to top,rgba(8,8,10,.92),rgba(8,8,10,0));color:#fff;font:700 .95rem/1.2 Figtree,sans-serif}
.acadinfo .aboutfacts{margin:0 0 18px;padding:0 0 0 18px;border-top:0;border-left:2px solid var(--accent);display:block}
.ovh{font-size:1.15rem;color:var(--accent);margin:20px 0 8px}
.contrib .para{max-width:65ch;margin:0 0 1em}
.blist{max-width:65ch;margin:0 0 1.2em;padding-left:1.2em}
.blist li{margin:10px 0}
.coverlink.ph{aspect-ratio:315/250;display:grid;place-items:center;text-align:center;line-height:1.4;color:var(--muted);background:linear-gradient(160deg,#2b1f3a,var(--card))}
.phtext{padding:0 16px;font-size:1rem}
.acadcover{display:flex;flex-direction:column;gap:14px}
.acadcover p{margin:0}
.acadinfo .aboutfacts div + div{margin-top:12px}
.acadinfo .lead{margin:0 0 6px;font-size:1.2rem;color:var(--ink)}
.cast{position:relative;margin:40px 0 8px;padding:28px 16px 14px;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 85%,rgba(120,96,220,.32),rgba(14,14,16,0) 68%),var(--card)}
.cast ul{list-style:none;margin:0;padding:0;display:flex;justify-content:center;align-items:flex-end}
.cast li{--s:1;height:calc(var(--h) * var(--s));margin:0 -12px;position:relative;top:var(--dy);opacity:0;transform:translateY(46px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i) * .16s)}
.cast.in li{opacity:1;transform:none}
.sprite{display:block;height:100%;transition:transform .3s ease}
.sprite:hover{transform:scale(1.07) rotate(-1.5deg)}
.cast li img{height:100%;width:auto;display:block;filter:drop-shadow(0 12px 18px rgba(0,0,0,.55));animation:castfloat 5.5s ease-in-out infinite;animation-delay:calc(var(--i) * -1.3s)}
@keyframes castfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.castcredit{margin:14px 0 0;text-align:center;font-size:.85rem;color:var(--muted)}
@media (max-width:600px){.cast li{--s:.68;margin:0 -8px}}
@media (prefers-reduced-motion:reduce){.cast li{opacity:1;transform:none;transition:none}.cast li img{animation:none}}
.acadmedia{margin:36px 0 8px}
.rolegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 48px;margin:32px 0 8px}
.role h3{font-size:1.15rem;color:var(--accent);margin:0 0 8px}
.role p{margin:0}
.audiolist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.audiolist li{display:grid;gap:4px}
.scframe{width:100%;height:300px;border:0;border-radius:10px;margin-top:12px}
.sclink{margin:6px 0 0;font-size:.9rem}
.sclink a{color:var(--muted)}
.lb{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;background:rgba(6,6,8,.95)}
.lb-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.lb-cap{color:var(--muted);font-size:.95rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-btns{display:flex;gap:10px;flex:none}
.lb-btn{background:rgba(14,14,16,.9);border:2px solid var(--accent);border-radius:999px;color:var(--accent);padding:8px 18px;font:inherit;font-weight:500;cursor:pointer}
.lb-btn:hover,.lb-btn:focus-visible{background:var(--accent);color:var(--bg)}
.lb-stage{flex:1;min-height:0;overflow:hidden;display:grid;place-items:center;padding:4px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.lb-stage img{display:block;max-width:100%;max-height:calc(100vh - 92px);max-height:calc(100dvh - 92px);object-fit:contain;cursor:zoom-in}
.lb.full .lb-stage{display:block;overflow:auto;text-align:center}
.lb.full .lb-stage img{display:inline-block;max-width:none;max-height:none;cursor:zoom-out}
.catintro{max-width:65ch;font-size:1.2rem;color:var(--ink);margin:0 0 8px}
.ugc .lead{max-width:65ch;font-size:1.2rem;color:var(--ink);margin:0 0 24px}
.kpistrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.kpi{display:flex;flex-direction:column;gap:4px;padding:20px 20px 18px;border:2px solid var(--accent);border-radius:14px;background:linear-gradient(160deg,#241b26,var(--card))}
.kpi b{font:800 clamp(2.1rem,4.4vw,3.2rem)/1 "Bricolage Grotesque",sans-serif;color:var(--accent)}
.kpi .kl{font-weight:500;color:var(--ink)}
.kpi .kn{font-size:.88rem;color:var(--muted)}
.kfoot{margin:8px 0 0;font-size:.85rem;color:var(--muted)}
.ugch{font-size:1.25rem;color:var(--accent);margin:44px 0 14px}
.prodgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.prod{padding:22px;border:2px solid var(--line);border-radius:14px;background:var(--card)}
.prod h3{font-size:1.4rem;margin:0 0 4px}
.prod .pp{margin:0 0 12px;font-size:.9rem;color:var(--muted)}
.pk{display:flex;gap:28px;margin:10px 0 12px}
.pk b{display:block;font:800 1.9rem/1 "Bricolage Grotesque",sans-serif;color:var(--accent)}
.pk span{font-size:.85rem;color:var(--muted)}
.prod .pf{margin:0 0 10px;font-size:.9rem;color:var(--ink)}
.prod ul{margin:0 0 16px;padding-left:1.2em}
.prod li{margin:6px 0}
.tags{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
.tags li{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:.95rem}
.pills{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
.pills a,.pills span{display:inline-block;padding:9px 16px;border:2px solid var(--line);border-radius:999px;text-decoration:none;background:var(--card)}
.pills a{border-color:var(--accent);color:var(--accent)}
.pills a:hover,.pills a:focus-visible{background:var(--accent);color:var(--bg)}
@media (max-width:800px){.prodgrid{grid-template-columns:1fr}}
.pill{display:inline-block;padding:2px 10px;border:1px solid var(--accent);border-radius:999px;font-size:.75rem;line-height:1.5;color:var(--accent);background:rgba(14,14,16,.6)}
.pills2{display:flex;gap:6px}
.langtoggle{display:flex;gap:8px}
.langbtn{padding:6px 16px;border:2px solid var(--accent);border-radius:999px;background:transparent;color:var(--accent);font:inherit;font-size:.9rem;font-weight:500;cursor:pointer;transition:background .2s,color .2s}
.langbtn:hover,.langbtn:focus-visible{background:rgba(246,169,207,.18)}
.langbtn.on{background:var(--accent);color:var(--bg)}
.arts{border-top:0;padding-top:12px}
.artgrid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.art{position:relative;display:block;width:100%;aspect-ratio:1/1;padding:0;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s,border-color .3s}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.2,1),filter .4s}
.artmeta{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:48px 16px 16px;background:linear-gradient(to top,rgba(8,8,10,.95),rgba(8,8,10,0));opacity:0;transform:translateY(14px);transition:opacity .35s,transform .4s cubic-bezier(.2,.8,.2,1)}
.artmeta b{font:800 1.15rem/1.15 "Bricolage Grotesque",sans-serif;color:#fff}
.artmeta time{font-size:.85rem;color:var(--muted)}
.art:hover,.art:focus-visible{transform:scale(1.08);z-index:3;border-color:var(--accent);box-shadow:0 18px 40px rgba(0,0,0,.55)}
.art:hover img,.art:focus-visible img{transform:scale(1.07);filter:brightness(.75)}
.art:hover .artmeta,.art:focus-visible .artmeta{opacity:1;transform:none}
@media (hover:none){.artmeta{opacity:1;transform:none}.art:hover{transform:none}}
.soonart{display:grid;place-items:center;text-align:center;border-style:dashed;color:var(--muted);cursor:default;line-height:1.5}
.artmodal{position:fixed;inset:0;z-index:110;overflow-y:auto;background:rgba(6,6,8,.92);padding:24px 14px 40px;animation:artin .3s ease}
@keyframes artin{from{opacity:0}to{opacity:1}}
.artpanel{max-width:800px;margin:0 auto;padding:22px clamp(18px,5vw,56px) 36px;border:2px solid var(--line);border-radius:18px;background:var(--bg);animation:artup .4s cubic-bezier(.2,.8,.2,1);outline:none}
@keyframes artup{from{transform:translateY(28px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.artbar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;margin:0 -8px 8px;padding:8px;background:linear-gradient(to bottom,var(--bg) 70%,rgba(14,14,16,0))}
.arthead h1{font-size:clamp(1.9rem,5vw,3rem);line-height:1.08;margin:8px 0 12px}
.artsub{margin:0 0 16px;font-size:1.2rem;line-height:1.4;color:var(--muted)}
.artby{margin:0;font-size:.95rem;color:var(--muted)}
.artby strong{color:var(--ink)}
.adiv{border:0;height:1px;margin:34px 0;background:var(--line)}
.adiv.strong{height:3px;margin:22px 0 28px;background:var(--accent);border-radius:3px}
.artfig{margin:0 0 32px}
.artfig img{width:100%;height:auto;display:block;border-radius:12px}
.artfig figcaption{margin-top:8px;font-size:.88rem;color:var(--muted)}
.artbody p{max-width:none;margin:0 0 1.15em;font-size:1.08rem;line-height:1.8}
.artbody h2{font-size:clamp(1.4rem,3.4vw,1.9rem);color:var(--accent);margin:0 0 16px}
.artbody .pull{padding:6px 0 6px 20px;border-left:3px solid var(--accent);font:800 1.25rem/1.4 "Bricolage Grotesque",sans-serif;color:var(--ink)}
.artfoot{margin-top:32px;text-align:center}
@media (prefers-reduced-motion:reduce){.artmodal,.artpanel{animation:none}.art,.art img,.artmeta{transition:none}}
.contact{padding:8px 0 90px}
.contact h2{font-size:clamp(1.6rem,3.5vw,2.4rem);margin-bottom:24px}
.clist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.cbtn{display:flex;align-items:center;gap:16px;padding:14px 18px 14px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);text-decoration:none;transition:border-color .2s,transform .2s,background .2s}
.cbtn:hover,.cbtn:focus-visible{border-color:var(--accent);transform:translateY(-2px);background:#211f23}
.cico{flex:none;display:grid;place-items:center;width:50px;height:50px;border:2px solid var(--accent);border-radius:12px;color:var(--accent);transition:background .2s,color .2s}
.cbtn:hover .cico,.cbtn:focus-visible .cico{background:var(--accent);color:var(--bg)}
.ctext{display:flex;flex-direction:column;min-width:0}
.clabel{font-size:.82rem;color:var(--muted)}
.cval{font-weight:500;overflow-wrap:anywhere}
.alabel{margin:14px 0 0;font-size:.85rem;color:var(--muted)}
.alabel + .audiolist{margin-top:6px}
.atitle{font-size:.85rem;color:var(--muted)}
.audiolist audio{width:100%;height:38px}
.soonbox{padding:8px 12px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:.9rem}
@media (max-width:800px){.rolegrid{grid-template-columns:1fr}}
.soon{color:var(--muted)}
@media (max-width:800px){.acadtop{grid-template-columns:1fr;gap:24px}.coverlink{max-width:315px}}
.partners{padding:8px 0 48px}
.partners h2{font-size:clamp(1.6rem,3.5vw,2.4rem);margin-bottom:20px}
.chip{display:flex;align-items:center;justify-content:center;height:64px;padding:10px 16px;border-radius:8px;background:#f7e8ef;color:#0e0e10;font:800 1rem/1.1 "Bricolage Grotesque",sans-serif;text-align:center;transition:transform .25s}
.chip img{max-width:100%;max-height:44px;object-fit:contain}
/* Project page */
.back{display:inline-block;margin:40px 0 28px;color:var(--muted)}
.project h1{font-size:clamp(2.2rem,6vw,4rem);font-weight:800}
.facts{display:flex;flex-wrap:wrap;gap:12px 40px;margin:24px 0 36px;padding:18px 0;border-block:1px solid var(--line)}
.facts dt{font-size:.85rem;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:500}
.project p{max-width:65ch}
.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start}
.top .facts{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;margin:8px 0 24px}
@media (max-width:800px){.top{grid-template-columns:1fr;gap:24px}}
.steam{display:inline-block;padding:10px 18px;border:2px solid var(--accent);border-radius:8px;text-decoration:none;font-weight:500}
.videos:empty{display:none}
.bottom{margin:48px 0 80px}
.topbtn{margin:40px 0 28px}
.steam:hover{background:var(--accent);color:var(--bg)}
.video video{width:100%;height:100%;object-fit:cover;display:block}
.contrib{margin:40px 0 8px}
.contrib ul,.contrib .lead{max-width:65ch}
.contrib h2{font-size:1.6rem;margin-bottom:12px}
.contrib h3{font-size:1.15rem;margin:28px 0 8px;color:var(--accent)}
.contrib .lead{font-size:1.15rem;color:var(--muted)}
.contrib ul{margin:0;padding-left:1.2em}
.contrib li{margin:8px 0}
.car{position:relative;margin:28px 0 24px;aspect-ratio:16/9;max-width:760px;border-radius:10px;overflow:hidden;background:var(--card);transition:transform .35s}
.car:hover{transform:scale(1.04);position:relative;z-index:2}
.slide{position:absolute;inset:0;margin:0;opacity:0;transition:opacity .8s}
.slide.on{opacity:1}
.slide img,.slide .ph{width:100%;height:100%;display:block}
.slide img{object-fit:cover}
.slide .zoom{display:block;width:100%;height:100%;cursor:zoom-in}
.slide.fit{background:#fff}
.slide.fit .zoom{position:absolute;top:0;left:0;right:0;bottom:76px;width:auto;height:auto}
.slide.fit img{object-fit:contain;background:transparent}
.slide video{position:absolute;top:0;left:0;right:0;bottom:76px;width:100%;height:calc(100% - 76px);object-fit:contain;display:block;cursor:pointer}
.slide.fit .cap{min-height:76px;display:flex;align-items:center;padding:14px 22px;background:#0e0e10}
.slide .ph{display:grid;place-items:center;color:rgba(255,255,255,.7);font-size:.9rem}
.cap{position:absolute;left:0;right:0;bottom:0;padding:48px 22px 18px;font:800 clamp(1.15rem,2.8vw,1.7rem)/1.1 "Bricolage Grotesque",sans-serif;color:#fff;background:linear-gradient(to top,rgba(8,8,10,.88),rgba(8,8,10,0))}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:46px;height:46px;padding:0;border-radius:50%;border:2px solid var(--accent);background:rgba(14,14,16,.78);color:var(--accent);display:grid;place-items:center;cursor:pointer;transition:background .2s,color .2s}
.arrow:hover,.arrow:focus-visible{background:var(--accent);color:var(--bg)}
.arrow.prev{left:12px}
.arrow.next{right:12px}
.count{position:absolute;top:12px;right:12px;z-index:3;padding:3px 11px;border-radius:999px;background:rgba(14,14,16,.78);color:var(--ink);font-size:.85rem}
@media (prefers-reduced-motion:reduce){.slide,.car{transition:none}}
.featured{max-width:860px;margin:0 0 36px}
.car.full{max-width:none}
.note{margin:6px 0 0;font-size:.9rem;color:var(--muted);max-width:65ch}
.media{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin:24px 0 36px;align-items:start}
.media .car{margin:0;max-width:none}
.vcap{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;margin:10px 0 0;font-size:.9rem}
.vtitle{font:800 1.05rem/1.2 "Bricolage Grotesque",sans-serif}
.vcap a{color:var(--muted)}
@media (max-width:700px){.media{grid-template-columns:1fr}}
.alt{margin:8px 0 0;font-size:.9rem}
.alt a{color:var(--muted)}
.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px;margin:40px 0 80px}
.video{aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--card);display:grid;place-items:center;color:var(--muted);border:1px dashed var(--line)}
.video iframe{width:100%;height:100%;border:0}
footer{padding:40px 0 60px;color:var(--muted);font-size:.9rem}

@media (prefers-reduced-motion:reduce){.card .cover{transition:none}}
@media (max-width:600px){.card{width:240px}}
</style>

  {id:"big-2022", title:"O que aprendi como Monitor do BIG 2022",
   subtitle:"Lições de design, comunicação e acessibilidade vividas dentro do BIG Festival",
   author:"Gustavo Mondini", role:"Jr. Game Designer", date:"July 24, 2022", lang:"pt-BR", langLabel:"Portuguese",
   card:"img/articles/big-2022-card.jpg", photo:"img/articles/big-2022-photo.jpg",
   photoAlt:"Gustavo Mondini and Shuhei Yoshida smiling and giving thumbs up at the BIG Festival",
   caption:"Com Shuhei Yoshida no BIG Festival.",
   body:`O BIG Festival é um festival brasileiro que tem o objetivo de divulgar e apoiar a indústria de games nacional, assim como desenvolvedores e estúdios independentes. Isso é feito através de sua divulgação, rodadas de negócios com patrocinadores dentro do evento e palestras que envolvem filosofias do Game Design. É claro que ao longo dos anos o BIG tem se tornado um evento mais popular e isto trouxe uma abrangência maior de público-alvo. Este ano, o BIG recebeu grandes apoiadores como Magazine Luiza e Omelete (Que é de fato o maior propagador da cultura nerd e geek, trazendo conteúdo com excelência internacional para o público brasileiro em mídias sociais).

Houve algumas contradições com relação à edição do BIG de 2022. O fato de ter se voltado mais para o “Mainstream” incomodou alguns que diziam que isto tirava o foco e o apoio de desenvolvedores independentes, que é a proposta do evento.

Porém, como um desenvolvedor de jogos júnior e entusiasta do jornalismo de games, tenho minha opinião concreta de que a importância desse evento para minha carreira como Game Designer foi algo ao qual eu serei grato para o resto de minha vida, e ao longo deste artigo, irei explicar as razões.

---

## O que eu fiz no BIG 2022?

Iniciei meus estudos no curso de Game Design da Universidade Anhembi Morumbi em janeiro de 2021. Desde então, claro que meu sonho se tornou conseguir alguma oportunidade de estágio ou entrar no mercado nacional que admiro tanto. Então quando surgiu a oportunidade de trabalhar no BIG, prontamente iniciei minha inscrição e após um processo seletivo fui convocado para trabalhar no festival como Super Monitor.

Este cargo recebe um nome bonito, mas a principal função foi ajudar as pessoas a configurar os jogos e dispositivos e tirar dúvidas sobre os aparelhos.

Claro, com minha paixão por video-games, isso se tornou muito maior dentro de mim. Busquei conhecer sobre cada jogo que estava em exposição, pois eu queria propagar a cultura do game design quando houvesse oportunidade. Explicar para a pessoa, por exemplo, que “Solar Ash” era um jogo que tinha foco em sua narrativa audiovisual, e era de um estúdio independente que veio crescendo, publicado pela Annapurna Interactive.

Eu interagi com as pessoas para tentar mostrar a beleza por trás do simples ato de jogar, pois afinal, isso é o BIG. Fico feliz em dizer que isto me trouxe experiências incríveis que nunca serei capaz de esquecer, e algumas delas vou deixar para descrever em tópicos a seguir.

Além da parte da monitoria dos games em exposição, fui encarregado de administrar algumas das palestras e eventos que ocorreram dentro do auditório, como o CBCS (Circuito brasileiro de Counter Strike) e principalmente a grande premiação dos jogos.

Como eu sou um fanático por Final Fantasy, não perdi a oportunidade de pedir para ajudar no auditório durante a palestra de Takashi Tokita (Lead Designer de Final Fantasy 4, Chrono Trigger e Live A Live)

---

## O que aprendi como Designer?

O ato de observar, conversar e interpretar as pessoas que estavam jogando me permitiu adquirir um grande repertório de dados sobre o feedback das pessoas. Seja que tipo de jogabilidade se torna atraente de cara ou que tipo de mecânica demora um pouco mais para pegar. Quais pessoas se interessam mais pelos jogos menores e experimentais ou quais se interessam pelas grandes marcas.

O conjunto dessas informações me permite melhorar meu trabalho pessoal e me preparar para a parte de contato com usuários, que é muito importante no processo de produção de um game.

Tive a oportunidade, no dia do meu treinamento (um dia antes da abertura) de jogar todos os jogos em exposição, tanto das grandes publicadoras que fizeram presença no evento, quanto dos desenvolvedores e estudantes brasileiros.

Ter essa “overdose” de conteúdo enriqueceu muito minhas referências. Fui apresentado a mecânicas inovadoras como um game que utiliza leitor facial do iPhone como input, ou o game “Welcome Back” que trouxe uma Demo tão polida que me agarrou do início ao fim e fez com maestria o ato de desenvolver a narrativa o suficiente para entrar na Steam e pesquisar o jogo logo que eu chegasse em casa. Este tipo de contato com inovação e experimentação não é possível ter dentro de casa, por mais que você pesquise.

O principal legado que tive como designer foi a mensagem de que este sonho é possível. Ver a beleza de jogar jogos de pessoas, para pessoas e com pessoas me motivou muito a continuar nessa jornada. As pessoas que estavam lá jogando são como eu, amam games. Porém mais do que isto, as pessoas que estavam expondo seus jogos também são como eu: amam fazer jogos, e amam a felicidade que podem trazer com poucos minutos de interatividade que tiveram com a audiência.

---

## O que aprendi sobre a comunicação

Falar com as pessoas é a habilidade mais importante que podemos desenvolver, pessoalmente e profissionalmente. O que nos difere de neandertais é a capacidade de viver em sociedade e cooperar, portanto o trabalho de monitor me permitiu treinar, aprender e exercer a comunicação de forma que nunca tinha feito antes.

Sempre fui aficionado por literatura, texto e redação, principalmente o jornalismo do nicho ao qual pertenço (games e cultura pop). Poder conversar com as pessoas sobre os jogos que elas gostam, o que elas gostaram no evento, o que elas jogaram e conhecê-las foi algo muito importante para minha formação.

Como escritor, o texto é sempre apoiado em suas referências e sua bagagem cultural, e a proporção do contato humano proporcionado por eventos como o BIG, que colocam muitas pessoas com um mesmo interesse em um ambiente em comum, enriquece muito a erudição e favorece o repertório.

Sinto que essa experiência me trouxe conhecimentos sociais que poucas pessoas tiveram a oportunidade de obter. Fora o fato de que, ao trabalhar na organização do evento, tive contato com pessoas da produção e do desenvolvimento, me permitindo conhecer mais sobre diversas áreas e aumentando tanto meu conhecimento sobre o nicho de games quanto de diversas outras profissões.

Além disso, tive a oportunidade de conhecer grandes referências pessoais (ou ídolos) que tenho relacionados à comunicação. Consegui conhecer o gênio da comunicação Felipe Goldenberg (“Goldenboy”) que trabalha atualmente no Canaltech, um veículo muito importante de tecnologia. Conheci também Angelo Sarmiento (Analista de produto da Omelete Company), que eu já havia visto em produções do The Enemy (Veículo focado em games do Omelete). Poder conversar, por mais que de forma ligeira, com grandes inspirações que tenho para a área do jornalismo de games, também me motivou a, inclusive, redigir este artigo com o intuito de transmitir minhas experiências com as outras pessoas.

A experiência no BIG tornou claro para mim a importância que estes e outros influenciadores têm para indústria. Muitas vezes eles sofrem críticas por estarem no “jogo do capitalismo” e dobrarem-se aos patrocínios ou divulgações tendenciosas. Mas a beleza do trabalho de trazer informação sobre algo que amamos, na tentativa de unir as pessoas por um interesse em comum, é muito maior do que estas falácias, e no fim, o que eles fazem move a economia e a motivação das pessoas do mercado de games.

Trago como exemplo minha experiência pessoal. Se eu não consumisse o conteúdo produzido por veículos como Omelete, Nautilus, The Enemy, IGN etc. é provável que eu nunca tivesse me interessado por Game Design ou visto como uma profissão.

---

## O mais importante do BIG 2022

Para não estender demais um artigo tão pessoal que já pode ter desamarrado a atenção do leitor, desejo concluir com algumas das coisas que aprendi no evento que foram de fato as mais importantes.

Primeiramente tenho que citar algo que tocou o meu coração e me motivou muito:

> A acessibilidade que o festival trouxe para pessoas que não têm condições de jogar videogame.

É fato que no Brasil o hobby de jogar videogame é um luxo que poucas pessoas são capazes de ter, e, como monitor, ver o sorriso de um garoto jogando pela primeira vez, ou tendo seu primeiro contato com um PS5 ou VR na vida foi transformador para minha pessoa.

Esse momento me trouxe uma epifania e me fez enxergar a importância do que estou fazendo. É isso que quero trazer para as pessoas, essa felicidade incondicional que é permitida através da tecnologia.

Mais do que isso, em minha carreira, defenderei a luta de trabalhar para tornar os games mais acessíveis, seja estudando maneiras mais inteligentes de produzir ou apenas fortalecendo o mercado nacional, mas essa experiência única acendeu minha empolgação e motivou a continuar o caminho pelo Game Design.

Por fim, gostaria de citar que algo muito importante para mim foi a sensação de gratidão pelo evento. Quando olho para meu perfil profissional, como um jovem que acabou de entrar no mercado de games, sinto-me muitas vezes perdido em meio às oportunidades e caminhos possíveis para seguir, mas poder ter contato com pessoas da área, com pessoas de outras áreas e com o público do evento, me permite traçar uma estratégia melhor para tornar meu sonho possível. Aprendi muito, vivi muito e conheci muito, e espero que tenha conseguido tornar a experiência de alguém um pouco melhor durante o BIG 2022.

Para aqueles que participaram do festival, obrigado, vocês me ajudaram a ter essa experiência enriquecedora.

Para aqueles que estão lendo e não participaram: Aguardo vocês no ano que vem, como Game Designer.`,
   // English version (switched with the language buttons in the article popup)
   en:{title:"What I Learned as a Monitor at BIG 2022",
       subtitle:"Lessons in design, communication and accessibility from inside the BIG Festival",
       caption:"With Shuhei Yoshida at the BIG Festival.",
       body:`BIG Festival is a Brazilian festival that aims to promote and support the national games industry, as well as independent developers and studios. It does this through publicity, business rounds with sponsors inside the event, and talks about Game Design philosophies. Of course, over the years BIG has become a more popular event, and this has brought a broader target audience. This year, BIG welcomed major supporters such as Magazine Luiza and Omelete (which is in fact the biggest promoter of nerd and geek culture, bringing content of international quality to the Brazilian public on social media).

There were some contradictions regarding the 2022 edition of BIG. The fact that it turned more toward the “mainstream” bothered some people, who said this took the focus and support away from independent developers, which is the purpose of the event.

However, as a junior game developer and an enthusiast of games journalism, I have a firm opinion that the importance of this event for my career as a Game Designer is something I will be grateful for for the rest of my life, and throughout this article I will explain why.

---

## What did I do at BIG 2022?

I began studying Game Design at Anhembi Morumbi University in January 2021. Since then, my dream has naturally been to find an internship or to enter the national market that I admire so much. So when the opportunity to work at BIG came up, I promptly applied, and after a selection process I was called up to work at the festival as a Super Monitor.

This role has a fancy name, but the main job was to help people set up games and devices and to answer questions about the equipment.

Of course, with my passion for video games, this became much bigger inside me. I made an effort to learn about every game on display, because I wanted to spread the culture of game design whenever there was an opportunity. I would explain to someone, for example, that “Solar Ash” was a game focused on its audiovisual narrative, made by a growing independent studio and published by Annapurna Interactive.

I interacted with people to try to show the beauty behind the simple act of playing, because after all, that is what BIG is about. I am happy to say that this gave me incredible experiences that I will never be able to forget, and I will describe some of them in the topics below.

Besides monitoring the games on display, I was put in charge of managing some of the talks and events that took place in the auditorium, such as the CBCS (the Brazilian Counter-Strike Circuit) and, above all, the big games awards ceremony.

As I am a Final Fantasy fanatic, I did not miss the chance to ask to help in the auditorium during the talk by Takashi Tokita (Lead Designer of Final Fantasy 4, Chrono Trigger and Live A Live).

---

## What did I learn as a Designer?

Observing, talking to and interpreting the people who were playing allowed me to build up a large repertoire of data about people's feedback: which kinds of gameplay are appealing right away, and which kinds of mechanics take a little longer to catch on; which people are more interested in smaller, experimental games, and which are more interested in the big brands.

All of this information lets me improve my own work and prepares me for the contact with users, which is very important in a game's production process.

On my training day (the day before the opening), I had the chance to play every game on display, both from the big publishers present at the event and from Brazilian developers and students.

This “overdose” of content greatly enriched my references. I was introduced to innovative mechanics, such as a game that uses the iPhone's face reader as input, and to the game “Welcome Back,” whose demo was so polished that it hooked me from beginning to end, and developed its narrative so masterfully that I looked the game up on Steam as soon as I got home. This kind of contact with innovation and experimentation is not possible at home, no matter how much you research.

The main legacy I took away as a designer was the message that this dream is possible. Seeing the beauty of playing games made by people, for people and with people motivated me a lot to continue on this journey. The people playing there are like me: they love games. But more than that, the people exhibiting their games are also like me: they love making games, and they love the happiness they can bring with the few minutes of interactivity they shared with the audience.

---

## What did I learn about communication?

Talking to people is the most important skill we can develop, both personally and professionally. What sets us apart from Neanderthals is the ability to live in society and cooperate, so the monitor job let me practice, learn and exercise communication in a way I never had before.

I have always been passionate about literature, writing and composition, especially the journalism of the niche I belong to (games and pop culture). Being able to talk to people about the games they like, what they enjoyed at the event and what they played, and to get to know them, was very important for my development.

As a writer, text is always supported by one's references and cultural background, and the amount of human contact provided by events like BIG, which put many people with a shared interest in a common environment, greatly enriches one's erudition and favors one's repertoire.

I feel this experience gave me social knowledge that few people have had the opportunity to obtain. In addition, by working in the organization of the event, I had contact with people from production and development, which let me learn more about several areas and increased my knowledge of both the games niche and many other professions.

I also had the chance to meet great personal references (or idols) related to communication. I got to meet the communication genius Felipe Goldenberg (“Goldenboy”), who currently works at Canaltech, a very important technology outlet. I also met Angelo Sarmiento (Product Analyst at Omelete Company), whom I had already seen in productions by The Enemy (Omelete's games-focused outlet). Being able to talk, even briefly, with great inspirations of mine in the field of games journalism also motivated me to write this very article, in order to share my experiences with other people.

The BIG experience made clear to me the importance that these and other influencers have for the industry. They are often criticized for being in the “game of capitalism” and for bowing to sponsorships or biased promotion. But the beauty of the work of bringing information about something we love, in an attempt to unite people through a shared interest, is far greater than these fallacies, and in the end, what they do moves the economy and the motivation of the people in the games market.

I bring my personal experience as an example. If I had not consumed the content produced by outlets like Omelete, Nautilus, The Enemy, IGN and others, I probably would never have become interested in Game Design or seen it as a profession.

---

## The most important thing about BIG 2022

So as not to stretch out an article this personal, which may already have lost the reader's attention, I want to conclude with some of the things I learned at the event that were in fact the most important.

First, I have to mention something that touched my heart and motivated me a lot:

> The accessibility the festival brought to people who cannot afford to play video games.

It is a fact that in Brazil, playing video games is a luxury that few people can afford, and, as a monitor, seeing the smile of a boy playing for the first time, or having his first contact with a PS5 or VR in his life, was transformative for me.

That moment brought me an epiphany and made me see the importance of what I am doing. This is what I want to bring to people: this unconditional happiness made possible through technology.

More than that, throughout my career I will fight to make games more accessible, whether by studying smarter ways to produce or simply by strengthening the national market, but this unique experience sparked my excitement and motivated me to continue on the path of Game Design.

Finally, I would like to mention that something very important to me was the feeling of gratitude for the event. When I look at my professional profile, as a young person who has just entered the games market, I often feel lost among the possible opportunities and paths to follow, but being in contact with people from the field, with people from other fields and with the audience of the event lets me draw up a better strategy to make my dream possible. I learned a lot, lived a lot and met a lot, and I hope I managed to make someone's experience a little better during BIG 2022.

To those who took part in the festival: thank you, you helped me have this enriching experience.

To those of you who are reading and did not take part: I look forward to seeing you next year, as a Game Designer.`}}

// Image viewer: click an image to enlarge it; the Close button, Esc or a click outside shrinks it back
let lb = null, lbReturn = null;
function closeLightbox(){
  if (!lb) return;
  lb.remove(); lb = null; document.body.style.overflow = "";
  document.removeEventListener("keydown", lbKeys);
  if (lbReturn && lbReturn.focus) lbReturn.focus({preventScroll:true});
}
function lbKeys(e){
  if (!lb) return;
  if (e.key === "Escape") { e.preventDefault(); closeLightbox(); return; }
  if (e.key === "Tab") { const b = [...lb.querySelectorAll("button")], i = b.indexOf(document.activeElement); e.preventDefault(); b[(i + (e.shiftKey ? -1 : 1) + b.length) % b.length].focus(); }
}
function openLightbox(src, caption){
  closeLightbox();
  lbReturn = document.activeElement;
  lb = document.createElement("div");
  lb.className = "lb"; lb.setAttribute("role","dialog"); lb.setAttribute("aria-modal","true"); lb.setAttribute("aria-label","Image viewer");
  lb.innerHTML = '<div class="lb-bar"><span class="lb-cap"></span><span class="lb-btns"><button type="button" class="lb-btn" data-zoom>Zoom in</button><button type="button" class="lb-btn" data-close>✕ Close</button></span></div><div class="lb-stage"><img alt=""></div>';
  const img = lb.querySelector("img"), stage = lb.querySelector(".lb-stage"), zoom = lb.querySelector("[data-zoom]");
  img.src = src; img.alt = caption || ""; lb.querySelector(".lb-cap").textContent = caption || "";
  const toggle = () => { const full = lb.classList.toggle("full"); zoom.textContent = full ? "Zoom out" : "Zoom in"; };
  zoom.addEventListener("click", toggle); img.addEventListener("click", toggle);
  lb.querySelector("[data-close]").addEventListener("click", closeLightbox);
  stage.addEventListener("click", e => { if (e.target === stage) closeLightbox(); });
  document.body.appendChild(lb); document.body.style.overflow = "hidden";
  document.addEventListener("keydown", lbKeys);
  lb.querySelector("[data-close]").focus({preventScroll:true});
}
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest("a.zoom");

// Project carousels: auto-scroll in a loop; swipe on touch screens, arrows on desktop. Autoplay pauses on hover, touch and keyboard focus.
function initRail(){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const SETS = 6, SPEED = 0.06;                       // px per ms (about 60 px per second)
  app.querySelectorAll(".railwrap").forEach(wrap => {
    const rail = wrap.querySelector(".rail"), track = wrap.querySelector(".track");
    const period = () => track.scrollWidth / SETS;    // width of one full set of cards
    const step = () => { const c = rail.querySelector(".card"); return c ? c.getBoundingClientRect().width + 20 : 340; };
    let pos = period(), last = 0, raf = 0, hold = 0, hovering = false, touching = false, focused = false;
    rail.scrollLeft = pos;
    const keepInRange = () => { const p = period(); if (rail.scrollLeft >= 3*p) rail.scrollLeft -= p; else if (rail.scrollLeft < p) rail.scrollLeft += p; };
    const tick = t => {
      const dt = Math.min(t - last, 50); last = t;
      if (reduce || hovering || touching || focused || t < hold) { pos = rail.scrollLeft; if (t >= hold) keepInRange(); }
      else { pos += dt * SPEED; if (pos >= 3*period()) pos -= period(); rail.scrollLeft = pos; }
      raf = requestAnimationFrame(tick);
    };
    const go = dir => { hold = performance.now() + 3000; rail.scrollBy({left: dir * step(), behavior: reduce ? "auto" : "smooth"}); };
    wrap.querySelector(".arrow.prev").addEventListener("click", () => go(-1));
    wrap.querySelector(".arrow.next").addEventListener("click", () => go(1));
    // only a real mouse pointer pauses the autoplay (taps on touch screens must not leave it paused)
    wrap.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") hovering = true; });
    wrap.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") hovering = false; });
    rail.addEventListener("touchstart", () => touching = true, {passive:true});
    const endTouch = () => { touching = false; hold = performance.now() + 2500; };
    rail.addEventListener("touchend", endTouch, {passive:true});
    rail.addEventListener("touchcancel", endTouch, {passive:true});
    wrap.addEventListener("focusin", e => { focused = e.target.matches(":focus-visible"); });
    wrap.addEventListener("focusout", () => focused = false);
    raf = requestAnimationFrame(t => { last = t; tick(t); });
    cleanups.push(() => cancelAnimationFrame(raf));
  });
}

function initMore(){
  app.querySelectorAll("[data-open]").forEach(openBtn => {
    const id = openBtn.dataset.open, more = document.getElementById(id), closeBtn = app.querySelector(`[data-close="${id}"]`);
    if (!more || !closeBtn) return;
    const toggle = on => {
      more.classList.toggle("open", on);
      if (on) more.removeAttribute("inert"); else more.setAttribute("inert", "");
      openBtn.setAttribute("aria-expanded", String(on)); openBtn.hidden = on;

// Cast sprites rise into place the first time they scroll into view
function initReveal(){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  app.querySelectorAll(".cast").forEach(el => {
    if (reduce || !("IntersectionObserver" in window)) { el.classList.add("in"); return; }
    const io = new IntersectionObserver(es => { if (es[0].isIntersecting) { el.classList.add("in"); io.disconnect(); } }, {threshold: 0.2});
    io.observe(el); cleanups.push(() => io.disconnect());
  });
}

// Articles: a mosaic of 1:1 boxes; clicking one opens the full article in a popup
let artEl = null, artReturn = null;
function articleBody(md){
  return md.split(/\n\s*\n/).map(b => {
    b = b.trim();
    if (b === "---") return '<hr class="adiv">';
    if (b.startsWith("## ")) return `<h2>${esc(b.slice(3))}</h2>`;
    if (b.startsWith("> ")) return `<p class="pull">${esc(b.slice(2))}</p>`;
    return `<p>${esc(b)}</p>`;
  }).join("");
}
function closeArticle(){
  if (!artEl) return;
  artEl.remove(); artEl = null; document.body.style.overflow = "";
  document.removeEventListener("keydown", artKeys);
  if (artReturn && artReturn.focus) artReturn.focus({preventScroll:true});
}
function artKeys(e){
  if (!artEl) return;
  if (e.key === "Escape") { e.preventDefault(); closeArticle(); return; }
  if (e.key === "Tab") { const b = [...artEl.querySelectorAll("button, a[href]")]; if (!b.length) return; const i = b.indexOf(document.activeElement); e.preventDefault(); b[(i + (e.shiftKey ? -1 : 1) + b.length) % b.length].focus(); }
}
function articleView(a, lang){
  const t = lang === "en" && a.en ? a.en : a;
  return `<header class="arthead">
      <h1 id="art-title">${esc(t.title)}</h1>
      <p class="artsub">${esc(t.subtitle)}</p>
      <p class="artby"><strong>${esc(a.author)}</strong> · ${esc(a.role)} · <time>${esc(a.date)}</time></p>
    </header>
    <hr class="adiv strong">
    ${a.photo ? `<figure class="artfig"><img src="${esc(a.photo)}" alt="${esc(a.photoAlt)}" loading="lazy">${t.caption ? `<figcaption>${esc(t.caption)}</figcaption>` : ""}</figure>` : ""}
    <div class="artbody">${articleBody(t.body)}</div>`;
}
function openArticle(id, trigger){
  const a = ARTICLES.find(x => x.id === id);
  if (!a) return;
  closeArticle();
  artReturn = trigger || document.activeElement;
  artEl = document.createElement("div");
  artEl.className = "artmodal"; artEl.setAttribute("role","dialog"); artEl.setAttribute("aria-modal","true"); artEl.setAttribute("aria-labelledby","art-title");
  const langs = `<div class="langtoggle" role="group" aria-label="Article language"><button type="button" class="langbtn on" data-lang="${esc(a.lang)}" aria-pressed="true">${esc(a.langLabel)}</button>${a.en ? '<button type="button" class="langbtn" data-lang="en" aria-pressed="false">English</button>' : ""}</div>`;
  artEl.innerHTML = `<div class="artpanel" tabindex="-1">
    <div class="artbar">${langs}<button type="button" class="lb-btn" data-artclose>✕ Close</button></div>
    <article lang="${esc(a.lang)}">${articleView(a, a.lang)}</article>
    <div class="artfoot"><button type="button" class="lb-btn" data-artclose>✕ Close</button></div>
  </div>`;
  artEl.addEventListener("click", e => {
    if (e.target === artEl || e.target.closest("[data-artclose]")) { closeArticle(); return; }
    const lb = e.target.closest("[data-lang]");
    if (!lb) return;
    const lang = lb.dataset.lang, art = artEl.querySelector("article");
    art.innerHTML = articleView(a, lang === "en" ? "en" : a.lang);
    art.setAttribute("lang", lang === "en" ? "en" : a.lang);
    artEl.querySelectorAll("[data-lang]").forEach(x => { const on = x === lb; x.classList.toggle("on", on); x.setAttribute("aria-pressed", String(on)); });
    artEl.querySelector(".artpanel").scrollTop = 0;
  });
  document.body.appendChild(artEl); document.body.style.overflow = "hidden";
  document.addEventListener("keydown", artKeys);
  const panel = artEl.querySelector(".artpanel"); panel.scrollTop = 0; artEl.querySelector("[data-artclose]").focus({preventScroll:true});
}

function mediaKit(p){
  const carouselOf = (images, label, full) => (images && images.length) ? `<div class="car${full ? " full" : ""}" role="group" aria-roledescription="carousel" aria-label="${esc(label)} images">${
      images.map((im,k) => `<figure class="slide${im.fit || im.video ? " fit" : ""}"${im.bg ? ` style="background:${esc(im.bg)}"` : ""}>${im.video
        ? `<video src="${esc(im.video)}"${im.poster ? ` poster="${esc(im.poster)}"` : ""} muted playsinline preload="metadata" aria-label="${esc(im.title)}"></video>`
        : im.src
        ? `<a class="zoom" href="${esc(im.src)}" target="_blank" rel="noopener" aria-label="Open ${esc(im.title)} in full size"><img src="${esc(im.src)}" alt="${esc(im.title)}" loading="lazy"></a>`
        : `<div class="ph" style="background:linear-gradient(${135+k*40}deg, ${p.color}, #0b0b0d)">Image placeholder</div>`}<figcaption class="cap">${esc(im.title)}</figcaption></figure>`).join("")
    }${images.length > 1 ? `<button type="button" class="arrow prev" aria-label="Previous image"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button type="button" class="arrow next" aria-label="Next image"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="count" aria-hidden="true"></span>` : ""}</div>` : "";
  const carousel = g => carouselOf(g.images, g.title);
  // A category can have one video (video:"ID") or several (videos:[{title:"...", id:"ID"}]). An empty id shows "Video coming soon".
  const oneVideo = (title, id, note) => `<div class="cell">` + (id === ""
    ? `<div class="video cat-video">Video coming soon</div>`
    : `<div class="video cat-video"><iframe src="https://www.youtube.com/embed/${esc(id)}" title="${esc(p.title)} ${esc(title || "video")}" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>`)
    + `<p class="vcap">${title ? `<span class="vtitle">${esc(title)}</span>` : ""}${id ? `<a href="https://www.youtube.com/watch?v=${esc(id)}" target="_blank" rel="noopener">Watch on YouTube</a>` : ""}</p>${note ? `<p class="note"><em>${esc(note)}</em></p>` : ""}</div>`;
  const catVideo = g => (g.videos || (g.video === undefined ? [] : [{title:g.videoTitle, id:g.video}])).map(v => oneVideo(v.title, v.id)).join("");
  // Media layout: the image carousel sits beside the first video, the other videos fill a 2-column grid below.
  const media = g => { const car = carousel(g), vids = catVideo(g);
    return vids ? `<div class="media">${car ? `<div class="cell">${car}</div>` : ""}${vids}</div>` : car; };
  // featured: larger videos shown full width below the media grid
  const featured = g => (g.featured||[]).map(v => `<div class="featured">${oneVideo(v.title, v.id)}</div>`).join("");
  // blocks: render media in the exact order given. {video:{title,id,note}} = full-size video, {images:[...]} = full-width carousel, {videos:[...]} = videos side by side.
  const blocks = g => (g.blocks||[]).map(b => b.video ? `<div class="featured">${oneVideo(b.video.title, b.video.id, b.video.note)}</div>`
    : b.images ? carouselOf(b.images, g.title, true)
    : b.videos ? `<div class="media">${b.videos.map(v => oneVideo(v.title, v.id, v.note)).join("")}</div>`
    : b.mosaic ? `<div class="media">${b.mosaic.images ? `<div class="cell">${carouselOf(b.mosaic.images, g.title)}</div>` : ""}${(b.mosaic.videos||[]).map(v => oneVideo(v.title, v.id, v.note)).join("")}</div>`
    : b.text ? `<p class="para">${esc(b.text)}</p>`
    : b.list ? `<ul class="blist">${b.list.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "").join("");
  const groups = list => (list||[]).map(g => `<h3>${esc(g.title)}</h3>${g.points && g.points.length ? `<ul>${g.points.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : ""}${g.blocks ? blocks(g) : media(g) + featured(g)}`).join("");
  return {oneVideo, groups, carouselOf};
}

function project(p){

    <div class="videos">${yt.concat(clips).join("")}</div>

// Image carousels: fade to the next image every 3 s; hover/focus enlarges and pauses.
let cleanups = [];
function initCarousels(){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  app.querySelectorAll(".car").forEach(car => {
    const slides = [...car.querySelectorAll(".slide")];
    const vids = slides.map(sl => sl.querySelector("video"));
    const prev = car.querySelector(".arrow.prev"), next = car.querySelector(".arrow.next"), count = car.querySelector(".count");
    let i = 0, t = null, paused = false, visible = true;
    const play = v => { if (v && visible && !reduce) { const r = v.play(); if (r && r.catch) r.catch(() => {}); } };
    const show = n => { i = (n + slides.length) % slides.length;
      slides.forEach((s,k) => { s.classList.toggle("on", k===i); s.setAttribute("aria-hidden", k===i ? "false" : "true"); });
      vids.forEach((v,k) => { if (!v) return; if (k === i) { v.currentTime = 0; play(v); } else v.pause(); });
      if (count) count.textContent = (i+1) + " / " + slides.length; };
    const stop = () => clearTimeout(t);
    // image slides advance after 3 s; a video slide advances when the video ends
    const start = () => { stop(); if (reduce || paused || slides.length < 2 || vids[i]) return; t = setTimeout(() => { show(i+1); start(); }, 3000); };
    const hold = () => { paused = true; stop(); }, release = () => { paused = false; start(); };
    vids.forEach((v,k) => { if (!v) return; v.muted = true; v.loop = false;
      v.addEventListener("ended", () => { if (k !== i) return; if (paused || reduce) { v.currentTime = 0; play(v); } else { show(i+1); start(); } });
      v.addEventListener("click", () => { if (v.paused) play(v); else v.pause(); }); });
    car.addEventListener("mouseenter", hold); car.addEventListener("mouseleave", release);
    car.addEventListener("focusin", hold); car.addEventListener("focusout", release);
    if (prev) prev.addEventListener("click", () => { show(i-1); start(); });
    if (next) next.addEventListener("click", () => { show(i+1); start(); });
    if ("IntersectionObserver" in window) {            // videos only play while the reel is on screen
      const io = new IntersectionObserver(es => { visible = es[0].isIntersecting; const v = vids[i]; if (v) { if (visible) play(v); else v.pause(); } }, {threshold: 0.35});
      io.observe(car); cleanups.push(() => io.disconnect());
    }
    show(0); start(); cleanups.push(stop);
  });
}

function route(){

}
